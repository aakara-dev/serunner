#cloud-config
package_update: true
packages:
  - curl

# Secrets arrive base64-encoded so token/password characters never interact with YAML.
write_files:
  - path: /etc/gitlab-runner/config.toml
    permissions: "0600"
    encoding: b64
    content: ${config_toml_b64}
  - path: /etc/gitlab-runner/worker_ssh_key
    permissions: "0600"
    encoding: b64
    content: ${worker_ssh_key_b64}
  - path: /etc/systemd/system/gitlab-runner.service.d/azure.conf
    permissions: "0644"
    content: |
      [Service]
      # fleeting-plugin-azure uses DefaultAzureCredential; this selects the user-assigned identity.
      Environment=AZURE_CLIENT_ID=${client_id}
      Environment=FLEETING_PLUGIN_PATH=/opt/fleeting/plugins

runcmd:
  - |
    set -eu
    mkdir -p /opt/fleeting/plugins /var/lib/gitlab-runner
    curl -sfL -o /usr/local/bin/gitlab-runner "${runner_binary_url}"
    echo "${runner_binary_sha256}  /usr/local/bin/gitlab-runner" | sha256sum -c -
    chmod 0755 /usr/local/bin/gitlab-runner
    gitlab-runner install --user root --working-directory /var/lib/gitlab-runner --config /etc/gitlab-runner/config.toml
    # Plugin comes from registry.gitlab.com through the hub firewall; retry while rules settle.
    n=0
    until FLEETING_PLUGIN_PATH=/opt/fleeting/plugins gitlab-runner fleeting --config /etc/gitlab-runner/config.toml install; do
      n=$((n + 1)); [ "$n" -ge 20 ] && exit 1; sleep 30
    done
    systemctl daemon-reload
    systemctl enable --now gitlab-runner
