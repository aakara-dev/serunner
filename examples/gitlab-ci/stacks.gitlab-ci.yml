# Per-stack job templates for the Azure runners. Include in a project with:
#
#   include:
#     - project: '<group>/ci-templates'
#       ref: '<pinned tag>'
#       file: '/stacks.gitlab-ci.yml'
#
# Linux jobs: tag `linux-docker` -> docker-autoscaler, each job in its own image.
# Windows .NET Framework jobs: tag `windows-dotnetfx` -> instance executor (PowerShell).
# Image tags are pinned; bump them deliberately.

.linux:
  tags: [linux-docker]

.java-maven:
  extends: .linux
  image: maven:3.9.9-eclipse-temurin-21
  variables:
    MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2"
  cache:
    key: maven-$CI_COMMIT_REF_SLUG
    paths: [.m2/]
  script:
    - mvn -B verify

.scala-sbt:
  extends: .linux
  image: sbtscala/scala-sbt:eclipse-temurin-21.0.5_11_1.10.7_2.13.15
  variables:
    SBT_OPTS: "-Xmx6g -Dsbt.global.base=$CI_PROJECT_DIR/.sbt -Dsbt.ivy.home=$CI_PROJECT_DIR/.ivy2"
  cache:
    key: sbt-$CI_COMMIT_REF_SLUG
    paths: [.sbt/, .ivy2/, .cache/coursier/]
  script:
    - sbt -batch test package

.python-uv:
  extends: .linux
  image: ghcr.io/astral-sh/uv:0.5.11-python3.12-bookworm-slim
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  cache:
    key: uv-$CI_COMMIT_REF_SLUG
    paths: [.uv-cache/]
  script:
    - uv sync --frozen
    - uv run pytest

# Databricks bundle deploy. DATABRICKS_HOST / DATABRICKS_TOKEN (or OAuth M2M
# client id/secret) must be protected, masked CI/CD variables.
.databricks-bundle:
  extends: .python-uv
  script:
    # The uv slim image has no curl or unzip; install.sh needs both.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl unzip ca-certificates
    - curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v0.236.0/install.sh | sh
    - databricks bundle validate -t "$DATABRICKS_TARGET"
    - databricks bundle deploy -t "$DATABRICKS_TARGET"

.node:
  extends: .linux
  image: node:22.12.0-bookworm-slim
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm test

.dotnet:
  extends: .linux
  image: mcr.microsoft.com/dotnet/sdk:8.0
  variables:
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget"
  cache:
    key: nuget-$CI_COMMIT_REF_SLUG
    paths: [.nuget/]
  script:
    - dotnet restore
    - dotnet test --no-restore

.terraform:
  extends: .linux
  image:
    name: hashicorp/terraform:1.17.1
    entrypoint: [""]
  script:
    - terraform init -input=false
    - terraform fmt -check -recursive
    - terraform validate
    - terraform plan -input=false -out=tfplan
  artifacts:
    paths: [tfplan]
    expire_in: 1 day

# .NET Framework (net48 etc.) on the Windows pool. First job after idle waits for a cold
# instance (~20-30 min); later jobs within windows_idle_time reuse it.
.dotnet-framework:
  tags: [windows-dotnetfx]
  script:
    # bootstrap.ps1 installs the NuGet MSBuild targets, not nuget.exe, so restore via
    # MSBuild. RestorePackagesConfig covers packages.config projects as well as PackageReference.
    - msbuild /m /restore /p:RestorePackagesConfig=true /p:Configuration=Release
